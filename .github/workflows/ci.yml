name: AKM Health quality gates

# Manual only: this workflow never runs automatically on pull requests or pushes.
# Start it from the GitHub Actions tab ("Run workflow") when a hosted check is wanted.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt
          python -m pip check

      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci

      - name: Ruff, backend tests and TypeScript
        run: python scripts/check.py

      - name: Frontend unit and API-contract regression tests
        env:
          PYTHON: python
        run: |
          node --test frontend/scripts/test-dashboard.cjs frontend/scripts/test-nasa-panels.cjs frontend/scripts/test-history.cjs frontend/scripts/test-investigation-api.cjs frontend/scripts/test-registration.cjs

      - name: Frontend navigation
        run: npm --prefix frontend run test:navigation

      - name: Production frontend build
        run: npm --prefix frontend run build

# This job does not substitute for Chromium, screen-reader or NASA submission checks.
