  <style>

    .mini-label{font-size:10px;color:#636b76;text-transform:uppercase;letter-spacing:1.2px;font-weight:750;margin:0 11px 8px}.nav{display:grid;gap:4px}.nav button{background:none;border:0;border-radius:9px;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 11px;color:#414852;width:100%}.nav button[aria-current=page]{background:#e8eaed;color:#1e232b;font-weight:750}.nav button:hover{background:#f0f1f3}.nav .n{border:1px solid #adb3ba;border-radius:5px;width:25px;height:25px;display:grid;place-items:center;font-size:11px;font-weight:700}

    .main{min-width:0;flex:1;max-width:1640px}.topbar{background:#fff;border-bottom:1px solid #d9dce1;min-height:67px;display:flex;gap:18px;align-items:center;justify-content:space-between;padding:12px 32px}.crumb{font-size:12px;color:#656f7a}.top-actions{display:flex;align-items:center;gap:9px}.simulation{display:flex;align-items:center;gap:8px;font-size:12px}.simulation select{max-width:210px}
    .content{padding:30px 32px 50px;max-width:1390px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:23px}.page-head h1{margin:4px 0 6px;font-size:27px;letter-spacing:-.9px;line-height:1.17}.page-head p{margin:0;max-width:780px;color:#68717e;font-size:13px}.eyebrow{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;color:#737c86}
    .columns{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;align-items:start}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.stack{display:grid;gap:15px}.panel{background:#fff;border:1px solid #d5d9dd;border-radius:12px;padding:20px;min-width:0}.panel-header{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:17px}.panel h2{font-size:16px;letter-spacing:-.3px;margin:0 0 4px}.panel .sub{font-size:12px;color:#6d7581;margin:0}.meta{font-size:11px;color:#6b7380}.muted{color:#68717c}.metric-card{background:#fff;border:1px dashed #b6bec6;border-radius:11px;padding:16px;min-height:112px}.metric-card .k{font-size:12px;color:#606975}.metric-card .v{font-size:27px;font-weight:750;letter-spacing:-.9px;margin:10px 0 2px}.metric-card .s{font-size:11px;color:#7a818b}
    .pill{font-size:11px;display:inline-flex;align-items:center;gap:5px;font-weight:750;border:1px solid #9da5ad;border-radius:99px;padding:4px 9px;white-space:nowrap;background:#f6f7f8}.pill::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#727b85}.pill.attention{background:#e4e6e9}.pill.attention::before{background:#343b45}.pill.unknown{border-style:dashed;background:#fafafa}.pill.unknown::before{background:#a6acb4}.pill.normal{background:#f3f4f6}.pill.suspect{border-style:dashed}
    .button{border:1px solid #3b434e;background:#fff;color:#262e39;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:750;display:inline-flex;justify-content:center;align-items:center;gap:8px}.button:hover{background:#f0f1f4}.button.primary{background:#303741;color:#fff}.button.primary:hover{background:#1e252f}.button.ghost{border-color:transparent;background:#f1f2f4}.button:disabled{cursor:not-allowed;opacity:.55}.buttons{display:flex;gap:9px;flex-wrap:wrap}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar .grow{flex:1}.tag{font-size:10px;padding:3px 7px;background:#eef0f2;border:1px solid #d2d7dc;border-radius:5px;color:#555f6a;font-weight:650;white-space:nowrap}
    .notice{border:1px dashed #9ca6b0;padding:13px 16px;border-radius:10px;background:#f4f5f7;font-size:12px;color:#414955;margin:0 0 18px}.notice strong{color:#222a34}.notice.error{border-style:solid;border-color:#747b84;background:#e9e9eb}.notice.info{border-style:solid;background:#fff}.notice.success{border-style:solid;background:#eff0f2}
    .astronaut{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:12px;border-bottom:1px solid #eceef0;padding:14px 0}.astronaut:last-child{border:0;padding-bottom:0}.avatar{height:40px;width:40px;display:grid;place-items:center;background:#e9ebed;border:1px solid #b6bec7;border-radius:10px;font-weight:750;font-size:12px}.astronaut strong{font-size:13px}.astronaut small{display:block;color:#78818d;margin-top:3px;font-size:11px}
    .data-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #ebecef;gap:10px;font-size:12px}.data-row:last-child{border:0}.data-row strong{font-size:14px}.section-note{font-size:11px;color:#707986;border-top:1px dashed #c9cdd2;padding-top:12px;margin-top:15px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{display:grid;gap:7px}.field label{font-weight:750;font-size:12px}.field .hint{color:#717986;font-size:11px;line-height:1.42}.control{width:100%;border:1px solid #aeb6bf;border-radius:8px;background:#fff;padding:11px 12px;min-height:43px;color:#262d36}.control:disabled{background:#f3f4f5;color:#616973}.full{grid-column:1/-1}.field-error{color:#303741;background:#ededee;border:1px dashed #737c84;border-radius:7px;padding:8px;font-size:12px}.inline-help{margin:0;color:#616a77;font-size:12px;line-height:1.5}
    .table-wrap{overflow:auto;border:1px solid #dfe2e6;border-radius:8px}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px;white-space:nowrap}th{background:#f2f3f4;color:#5f6771;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:11px 12px;border-bottom:1px solid #d8dcdf}td{padding:11px 12px;border-bottom:1px solid #ebedef}tbody tr:last-child td{border:0}tbody tr:hover{background:#f9f9fa}
    .sparkline{display:grid;gap:10px}.chart-row{display:grid;grid-template-columns:92px 1fr 72px;align-items:center;gap:10px;font-size:12px}.bar-bg{height:16px;background:repeating-linear-gradient(90deg,#f2f3f4 0,#f2f3f4 24%,#e6e8eb 24%,#e6e8eb 25%);border-radius:4px;border:1px solid #e1e4e7;position:relative}.bar{height:100%;background:#7f8893;border-radius:3px}.baseline-line{position:absolute;top:-4px;bottom:-4px;border-right:2px dashed #2f3741}.chart-legend{display:flex;gap:14px;flex-wrap:wrap;color:#6d7580;font-size:11px;margin-top:12px}.chart-legend .block{display:inline-block;width:11px;height:8px;background:#7f8893;margin-right:6px}.chart-legend .dash{display:inline-block;width:11px;border-top:2px dashed #303741;vertical-align:middle;margin-right:6px}
    .tabs{display:flex;gap:4px;border-bottom:1px solid #d9dde1;margin:0 0 18px}.tabs button{border:0;background:transparent;padding:11px 16px;border-bottom:3px solid transparent;font-size:12px}.tabs button[aria-selected=true]{font-weight:750;border-bottom-color:#343b43}.result-card{border:1px solid #d5d8dd;border-radius:11px;padding:16px;background:#fcfcfd}.result-card h3{margin:0 0 7px;font-size:13px}.result-card p{margin:0;color:#656e79;font-size:12px}.bullet{margin:8px 0;padding-left:19px;font-size:12px}.bullet li{margin-bottom:8px}.status-box{border:1px dashed #a9b2ba;border-radius:10px;background:#f5f6f8;padding:14px}.status-box h3{margin:0 0 8px;font-size:14px}.status-box p{margin:0;color:#666d78;font-size:12px}.flow-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:17px}.step{text-align:center;border:1px dashed #b6bec5;border-radius:8px;padding:11px 5px;font-size:11px;color:#64707b}.step strong{display:block;color:#343d48;font-size:12px;margin-bottom:3px}.step.on{background:#e9ebed;border-style:solid;border-color:#8d97a0}.empty{padding:35px 15px;text-align:center;background:#fafafa;border:1px dashed #bcc2c8;border-radius:10px}.empty .symbol{font-size:22px;color:#6b7280;margin-bottom:12px}.empty h3{margin:0 0 5px;font-size:15px}.empty p{margin:0 auto 14px;max-width:440px;color:#6a7280;font-size:12px}.callout{border-left:3px solid #6d7680;padding:10px 14px;background:#f4f5f7;font-size:12px;color:#525b67}
    .footer{font-size:11px;color:#6c7580;padding:25px 0 0;display:flex;gap:12px;flex-wrap:wrap}.hide{display:none!important}
    @media(max-width:1120px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.columns{grid-template-columns:1fr}.sidebar{width:200px}.content{padding:24px}.topbar{padding:12px 24px}}
    @media(max-width:700px){.layout{display:block}.sidebar{height:auto;position:static;width:auto;border-right:0;border-bottom:1px solid #d9dce1;padding:9px 12px;gap:5px}.logo{padding:3px 6px}.logo-symbol{width:31px;height:31px}.logo strong{font-size:14px}.side-note,.mini-label{display:none}.nav{display:flex;overflow:auto;gap:5px}.nav button{min-width:max-content;padding:9px 11px;font-size:12px}.nav .n{display:none}.topbar{padding:10px 15px;align-items:flex-start;gap:10px}.crumb{display:none}.simulation{display:grid;gap:3px}.simulation select{max-width:160px}.content{padding:18px 13px 35px}.page-head{display:block}.page-head h1{font-size:24px}.page-head .buttons{margin-top:15px}.grid4,.grid2,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:16px}.chart-row{grid-template-columns:75px 1fr 60px}.flow-steps{grid-template-columns:repeat(2,1fr)}}
    @media(prefers-reduced-motion:no-preference){button,.panel{transition:background .13s ease}}
    @media print{.sidebar,.topbar,.button,.nav{display:none!important}.content{padding:0}.panel{break-inside:avoid}}
  .timeline-profile{margin:16px 0}.timeline-profile figcaption{font-weight:700}.timeline{display:flex;gap:8px;overflow-x:auto;list-style:none;padding:4px 0;margin:10px 0}.timeline li{min-width:6rem;text-align:center}.timeline strong,.timeline time{display:block;font-size:.8rem;margin-top:4px}.timeline-plot{position:relative;height:84px;background:#edf0f3}.timeline-baseline{position:absolute;left:0;right:0;border-top:1px dashed #505b68;z-index:1}.timeline-bar{position:absolute;bottom:0;left:30%;width:40%;background:#596779}
  .eyebrow,.section-note,.metric-card .s,.astronaut small,.meta,.field .hint,.step{color:#535e6b}
  .timeline:focus-visible,.table-wrap:focus-visible{outline:2px solid #505b68;outline-offset:2px}

<body>
  <a class="skip" href="#main-content">Pular para o conteúdo principal</a>
  <div class="layout">
    <aside class="sidebar" aria-label="Menu de navegação">
      <div class="logo"><span class="logo-symbol">AKM</span><div><strong>AKM Health</strong><small>Wireframes · AKM-10</small></div></div>
      <div><p class="mini-label">MVP · Telas P0</p><nav id="navigation" class="nav" aria-label="Telas do protótipo"></nav></div>
      <div class="side-note"><strong>PROTÓTIPO / NÃO É O APP</strong> Fluxos de UX simulados em memória. Não envia dados, não consulta APIs e não executa avaliações médicas.</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="crumb">PRODUTO / AKM HEALTH / <span id="crumb-now">Dashboard</span></div>
        <div class="top-actions"><label class="simulation">Estado de demonstração
          <select id="demo-mode" class="control" aria-label="Alternar estado de demonstração"><option value="base">Dados sintéticos</option><option value="loading">Carregamento simulado</option><option value="empty">Sem dados</option><option value="offline">Falha simulada</option></select>
        </label><span class="tag">LOW FIDELITY · P0</span></div>
      </header>
      <main id="main-content" class="content" tabindex="-1"></main>
    </div>
  </div>
  <script>
  (()=>{
    'use strict';
    const CREW=[{id:'A1',name:'Aurora',role:'Comando',baseline:8.0},{id:'A2',name:'Orion',role:'Engenharia',baseline:7.5},{id:'A3',name:'Vega',role:'Pesquisa',baseline:8.0},{id:'A4',name:'Lyra',role:'Operações',baseline:7.8}];
    const METRICS={sleep_hours:{label:'Horas de sono',unit:'h',zone:'astronaut',hint:'Sono efetivo no último período concluído. Valor entre 0 e 24 h.'},heart_rate_bpm:{label:'Frequência cardíaca',unit:'bpm',zone:'astronaut',hint:'Leitura pontual, preferencialmente em repouso. Valor positivo.'},mood_score:{label:'Bem-estar emocional',unit:'score_1_to_5',zone:'astronaut',hint:'Autoavaliação de 1 (muito ruim) a 5 (muito bom). Não é escala clínica validada.'},co2_ppm:{label:'CO₂ da cabine',unit:'ppm',zone:'habitat',hint:'Concentração do ar INTERNO da cabine simulada, em ppm.'},cabin_temp_c:{label:'Temperatura da cabine',unit:'C',zone:'habitat',hint:'Temperatura do ar INTERNO da cabine, em °C, não a temperatura de Marte.'}};
    let seq=1;const base=[];
    const nights=['2026-11-13T07:00:00Z','2026-11-14T07:00:00Z'];
    const src=[['A1',[5.2,5.4],[72,74],[4,3]],['A2',[5.6,5.7],[68,71],[4,3]],['A3',[5.3,5.6],[75,76],[3,null]],['A4',[7.7,7.9],[66,null],[4,4]]];
    function addBase(astronaut_id,kind,value,measured_at,quality='ok') {base.push({id:seq++,astronaut_id,kind,value,unit:METRICS[kind].unit,measured_at,source:'synthetic',quality,recorded_at:measured_at,measurement_zone:METRICS[kind].zone});}
    for(const [id,sleep,hr,mood] of src) for(const [kind,vals] of [['sleep_hours',sleep],['heart_rate_bpm',hr],['mood_score',mood]]) vals.forEach((v,i)=>{if(v!==null)addBase(id,kind,v,nights[i]);});
    [['2026-11-12T20:00:00Z',680,22.1],['2026-11-13T05:00:00Z',950,22.2],['2026-11-14T05:00:00Z',980,22.2]].forEach(([at,co2,temp])=>{addBase(null,'co2_ppm',co2,at);addBase(null,'cabin_temp_c',temp,at);});addBase(null,'co2_ppm',2200,'2026-11-14T05:05:00Z','suspect');
    const state={page:'dashboard',mode:'base',added:[],scope:'crew',subject:'A1',historyAstronaut:'all',historyKind:'all',historyQuality:'all',form:{kind:'sleep_hours',astronaut_id:'A1',value:'',source:'manual',quality:'ok',measured_at:'2026-11-14T16:00'},errors:{},success:'',analysis:null,followup:null,formRecheck:false,returnToFollowup:false,lastNotice:'',lastNoticeType:'success'};
    const MAIN=document.querySelector('#main-content');
    function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
    function fmt(n){if(n===null||n===undefined)return '—';return Number(n).toLocaleString('pt-BR',{maximumFractionDigits:1});}
    function dt(t){if(!t)return '—';const d=new Date(t);return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'UTC'}).format(d)+' UTC';}
    const investigationsByScope=new Map();
    const investigationKey=()=>state.scope==='crew'?'crew':state.subject;
    let lastDataMode=state.mode;
    const allRows=()=>[...(lastDataMode==='empty'?[]:base),...state.added];
    const okRows=()=>allRows().filter(x=>x.quality==='ok');
    function badge(text,klass='unknown'){return `<span class="pill ${klass}">${escapeHtml(text)}</span>`;}
    function notice(t,k='info'){return `<div class="notice ${k}" role="status">${t}</div>`;}
    function heading(n,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">AKM-10 / ODYSSEY-26 / ${escapeHtml(state.page.toUpperCase())}</div><h1 id="page-heading" tabindex="-1">${n}</h1><p>${desc}</p></div>${actions?`<div class="buttons">${actions}</div>`:''}</div>`;}
    function btn(label,action,primary=false,extra=''){return `<button class="button ${primary?'primary':''}" data-action="${action}" ${extra}>${label}</button>`;}
    function nav(page){state.page=page;state.errors={};state.lastNotice='';render();window.scrollTo(0,0);document.querySelector('#page-heading')?.focus({preventScroll:true});}
    function navHTML(){const items=[['dashboard','01','Dashboard'],['register','02','Registrar'],['history','03','Histórico'],['investigation','04','Investigação']];document.querySelector('#navigation').innerHTML=items.map(([id,n,title])=>`<button data-nav="${id}" ${id===state.page?'aria-current="page"':''}><span class="n">${n}</span>${title}</button>`).join('');document.querySelector('#crumb-now').textContent=items.find(x=>x[0]===state.page)?.[2]||'Dashboard';}
    function envLatest(kind){return [...okRows()].filter(x=>x.kind===kind).sort((a,b)=>b.measured_at.localeCompare(a.measured_at))[0];}
    function byKind(id,kind){return [...okRows()].filter(x=>x.astronaut_id===id&&x.kind===kind).sort((a,b)=>b.measured_at.localeCompare(a.measured_at))[0];}
    function displayBanner(){let h=notice('<strong>Protótipo navegável.</strong> Todos os perfis e dados são sintéticos. As análises são ilustrativas; não representam diagnóstico ou operação clínica.','info');if(state.mode==='offline')h+=notice('<strong>Falha simulada de conexão.</strong> O último conteúdo confirmado permanece visível. Nenhuma alteração será enviada. Confira o histórico antes de reenviar.','error');return h;}
    function dashboard(){const rows=allRows(),has=rows.length>0;const list=CREW.map(c=>{const sleep=byKind(c.id,'sleep_hours');return `<div class="astronaut"><div class="avatar">${c.id}</div><div><strong>${c.name}</strong><small>${c.role} · baseline sintética de sono ${fmt(c.baseline)} h</small></div><div style="text-align:right">${sleep?`<strong>${fmt(sleep.value)} h</strong><small>Última leitura · ${dt(sleep.measured_at)}</small>`:'<small>Sem registro</small>'}</div></div>`}).join('');
      const co=envLatest('co2_ppm'),temp=envLatest('cabin_temp_c');const pending=state.followup?.status==='pending';
      const cards=[["Tripulantes fictícios","4","Missão simulada"],["Medições disponíveis",String(rows.length),"Inclui leituras de qualidade suspeita"],["Último CO₂ interno",co?fmt(co.value)+' ppm':'—',co?dt(co.measured_at):'Sem medição'],["Verificações pendentes",pending?'1':'0','Somente após análise ilustrativa']];
      return heading('Visão geral da missão','Resumo das observações simuladas, condições da cabine e próximos passos. Nenhum estado exibido comprova segurança clínica.',btn('＋ Registrar medição','to-register',true)+btn('Investigar tripulação','to-investigate'))+displayBanner()+`<div class="notice"><strong>Contexto da missão:</strong> ODYSSEY-26 · Dia 124 (ficcional) · Superfície de Marte (cenário) · Gravidade de referência ≈ 0,38 g. <span class="muted">Informação planetária contextual, não medição do habitat ou de saúde.</span></div><div class="grid4">${cards.map(([k,v,s])=>`<article class="metric-card"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></article>`).join('')}</div><div class="columns"><div class="stack"><section class="panel"><div class="panel-header"><div><h2>Tripulação · ODYSSEY-26</h2><p class="sub">Últimas leituras válidas. Dados ausentes não são zero.</p></div>${badge('4 perfis fictícios')}</div>${list}</section><section class="panel"><div class="panel-header"><div><h2>Situação da investigação</h2><p class="sub">A avaliação não é feita automaticamente ao abrir o dashboard.</p></div></div>${state.analysis?`<div class="status-box"><h3>${badge(state.analysis.status==='attention'?'Atenção demonstrativa':state.analysis.status==='insufficient_data'?'Dados insuficientes':'Sem padrão pela regra',state.analysis.status==='attention'?'attention':'unknown')} · ${escapeHtml(state.analysis.title)}</h3><p>${escapeHtml(state.analysis.summary)}</p></div><div class="buttons" style="margin-top:14px">${btn('Consultar resultado','to-investigate')}</div>`:`<div class="empty"><div class="symbol">◇</div><h3>Nenhuma investigação executada</h3><p>Abra a investigação para comparar os dados. Um dashboard não deve inferir diagnósticos por conta própria.</p>${btn('Abrir investigação','to-investigate')}</div>`}</section></div><div class="stack"><section class="panel"><div class="panel-header"><div><h2>Ambiente interno</h2><p class="sub">Leituras fict     function history(){const all=allRows(),filtered=all.filter(x=>(state.historyAstronaut==='all'||(state.historyAstronaut==='habitat'?x.astronaut_id===null:x.astronaut_id===state.historyAstronaut))&&(state.historyKind==='all'||x.kind===state.historyKind)&&(state.historyQuality==='all'||x.quality===state.historyQuality)).sort((a,b)=>b.measured_at.localeCompare(a.measured_at));

      const filters=`<div class="toolbar"><label class="field"><span class="meta">Sujeito</span><select class="control" id="hist-subject"><option value="all">Todos</option><option value="habitat" ${state.historyAstronaut==='habitat'?'selected':''}>Habitat</option>${CREW.map(c=>`<option value="${c.id}" ${state.historyAstronaut===c.id?'selected':''}>${c.id} · ${c.name}</option>`).join('')}</select></label><label class="field"><span class="meta">Indicador</span><select class="control" id="hist-kind"><option value="all">Todos os indicadores</option>${Object.entries(METRICS).map(([k,m])=>`<option value="${k}" ${state.historyKind===k?'selected':''}>${m.label}</option>`).join('')}</select></label><label class="field"><span class="meta">Qualidade</span><select class="control" id="hist-quality"><option value="all">Todas</option><option value="ok" ${state.historyQuality==='ok'?'selected':''}>Confiáveis</option><option value="suspect" ${state.historyQuality==='suspect'?'selected':''}>Suspeitas</option></select></label>${btn('Limpar filtros','clear-filters')}</div>`;

    function sleepProfile(profile){

    function sleepEvidence({profile,readings}){

    function analysisFor(){
      if(state.scope==='individual'){
        const result=sleepProfile(CREW.find(profile=>profile.id===state.subject));
        if(result.readings.length<2)return insufficient('Registre duas observações válidas de sono em dias distintos para este perfil.');
        return {status:result.affected?'attention':'normal',
          title:result.affected?'Mudança persistente de sono':'Nenhum padrão correspondente',
          summary:result.affected?result.profile.name+' apresentou duas leituras em até 80% da baseline fictícia.':'A regra sintética não identificou o padrão neste perfil.',
          findings:result.affected?[sleepEvidence(result)]:[],
          evidence:[sleepEvidence(result)],
          hypotheses:result.affected?['Mudança de turno, rotina e condições de coleta são explicações alternativas.']:[],
          nextCheck:result.affected?{kind:'sleep_hours',reason:'Repetir a observação do sono e revisar condições de coleta.',astronaut_id:result.profile.id}:null};
      }

      const groups=new Map();
      for(const result of CREW.map(sleepProfile)){
        if(result.days.length!==2)continue;
        const key=result.days.join('/');
        const group=groups.get(key)??[];
        group.push(result);
        groups.set(key,group);
      }
      const comparable=Array.from(groups.values()).filter(group=>group.length>=2)
        .sort(([a],[b])=>b.days[1].localeCompare(a.days[1])||b.days[0].localeCompare(a.days[0]))[0];
      if(!comparable)return insufficient('A análise coletiva exige ao menos dois perfis com observações válidas de sono nos mesmos dois dias.');
      const affected=comparable.filter(result=>result.affected);
      const evidence=comparable.map(sleepEvidence);
      if(affected.length<2)return {status:'normal',title:'Sem padrão coletivo pela regra',summary:'Os períodos são comparáveis. A regra não encontrou alterações em pelo menos dois perfis.',findings:[],evidence,hypotheses:[],nextCheck:null};

      const days=comparable[0].days;
      const co2=okRows().filter(row=>row.kind==='co2_ppm'&&row.astronaut_id===null)
        .sort((a,b)=>a.measured_at.localeCompare(b.measured_at)||a.id-b.id);
      const aligned=days.map(day=>co2.findLast(row=>row.measured_at.slice(0,10)===day));
      const baseline=co2.findLast(row=>row.measured_at.slice(0,10)<days[0]);
      const shift=baseline&&aligned.every(Boolean)&&(aligned.every(row=>row.value>baseline.value)||aligned.every(row=>row.value<baseline.value));
      if(baseline&&aligned.every(Boolean))evidence.push('CO₂ interno válido: '+[baseline,...aligned].map(row=>fmt(row.value)+' ppm').join(' → ')+'.');

        summary:'Padrão demonstrativo em '+affected.length+' perfis comparáveis.',
        findings:affected.map(sleepEvidence),evidence,
        hypotheses:[...(shift?['Possível coincidência com mudança no CO₂ interno. Hipótese não confirmada.']:[]),
          'Rotina, carga de trabalho e condições da coleta são explicações alternativas.'],
        nextCheck:{kind:'co2_ppm',reason:'Conferir novamente o CO₂ interno e a qualidade da coleta.',astronaut_id:null}};
    }
    function investigation(){let r=state.analysis;const ins=state.scope==='individual';const scopeForm=`<div class="form-grid"><div class="field"><label for="scope">Escopo da análise</label><select id="scope" class="control"><option value="crew" ${!ins?'selected':''}>Coletivo · tripulação</option><option value="individual" ${ins?'selected':''}>Individual · astronauta</option></select></div><div class="field"><label for="invest-subject">Tripulante</label><select id="invest-subject" class="control" ${!ins?'disabled':''}>${CREW.map(c=>`<option value="${c.id}" ${state.subject===c.id?'selected':''}>${c.id} · ${c.name}</option>`).join('')}</select></div></div><div class="buttons" style="margin-top:17px">${btn('Simular investigação','run-analysis',true)}</div>`;

      return heading('Investigação e verificação','Fluxo explicável: observar → identificar padrões → formular hipótese → solicitar nova coleta → reanalisar.',btn('Abrir histórico','to-history'))+displayBanner()+(state.lastNotice?notice(`<strong>${escapeHtml(state.lastNotice)}</strong>`,state.lastNoticeType):'')+`<div class="flow-steps"><div class="step on"><strong>01 · Medir</strong>Coleta</div><div class="step on"><strong>02 · Investigar</strong>Achados</div><div class="step ${state.followup?'on':''}"><strong>03 · Verificar</strong>Nova leitura</div><div class="step ${state.followup?.status==='completed'?'on':''}"><strong>04 · Reanalisar</strong>Acompanhamento</div></div><div class="stack"><section class="panel"><div class="panel-header"><div><h2>Executar análise</h2><p class="sub">Escopo coletivo ou individual. A análise só ocorre por uma ação explícita.</p></div>${badge('POST /api/investigations/run')}</div>${scopeForm}</section><section class="panel"><div class="panel-header"><div><h2>Resultado explicável</h2><p class="sub">Separação obrigatória entre observações, evidências, hipóteses e ação.</p></div>${badge('Somente simulação')}</div>${result}</section><section class="panel"><div class="panel-header"><div><h2>Próxima verificação e acompanhamento</h2><p class="sub">A medição precisa ser salva antes de concluir o follow-up.</p></div>${badge('GET/PATCH /api/followups')}</div>${follow}</section><section class="panel"><h2>Limites e proveniência</h2><p class="inline-help">A <a href="https://humanresearchroadmap.nasa.gov/Risks/risk.aspx?i=100">referência NASA HRR-100 sobre sono</a> oferece contexto científico. Os valores de 20% na regra de sono e as leituras da ODYSSEY-26 são exemplos sintéticos não validados clinicamente. O estado vermelho/critical não é acionado neste protótipo. O histórico quantitativo NASA ainda depende da AKM-38/39.</p></section></div>`;
    }

        ? heading('Carregando dados','Estado simulado. Selecione outro estado para continuar.')
        : ({dashboard,register,history,investigation}[state.page])();
      document.querySelector('#demo-mode').value=state.mode;
      if(previous)document.getElementById(previous)?.focus({preventScroll:true});
    }
    document.querySelector('#navigation').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)nav(b.dataset.nav)});
    document.querySelector('#demo-mode').addEventListener('change',e=>{
      state.mode=e.target.value;
      if(state.mode==='empty'||state.mode==='base'){
        if(state.mode!==lastDataMode){
          investigationsByScope.clear();state.analysis=null;state.followup=null;state.added=[];state.success='';state.lastNotice='';
          state.formRecheck=false;state.returnToFollowup=false;
        }
        lastDataMode=state.mode;
      }
      render();
    });
    MAIN.addEventListener('change',e=>{
      if(e.target.id==='kind'){state.form.kind=e.target.value;state.form.value='';state.success='';state.errors={};render();}
      else if(e.target.id==='target')state.form.astronaut_id=e.target.value;
      else if(['source','quality','measured_at'].includes(e.target.id))state.form[e.target.id]=e.target.value;
      else if(e.target.id==='hist-subject'){state.historyAstronaut=e.target.value;render();}
      else if(e.target.id==='hist-kind'){state.historyKind=e.target.value;render();}
      else if(e.target.id==='hist-quality'){state.historyQuality=e.target.value;render();}
      else if(e.target.id==='scope'||e.target.id==='invest-subject'){
        investigationsByScope.set(investigationKey(),{analysis:state.analysis,followup:state.followup});
        if(e.target.id==='scope')state.scope=e.target.value;
        else state.subject=e.target.value;
        const saved=investigationsByScope.get(investigationKey());
        state.analysis=saved?.analysis??null;state.followup=saved?.followup??null;state.lastNotice='';
        state.formRecheck=false;state.returnToFollowup=false;
        render();
      }
    });
    MAIN.addEventListener('input',e=>{if(e.target.id==='value')state.form.value=e.target.value;});
    MAIN.addEventListener('submit',e=>{if(e.target.id==='measurement-form'){e.preventDefault();saveForm();}});
    function saveForm(){state.errors={};state.success='';const f=state.form,k=METRICS[f.kind],n=Number(f.value);if(f.value.trim()===''||!Number.isFinite(n))state.errors.value='Informe um número finito.';else if(f.kind==='sleep_hours'&&(n<0||n>24))state.errors.value='Informe uma duração entre 0 e 24 horas.';else if(f.kind==='heart_rate_bpm'&&n<=0)state.errors.value='Informe um valor positivo.';else if(f.kind==='mood_score'&&![1,2,3,4,5].includes(n))state.errors.value='Escolha um número inteiro de 1 a 5.';else if(f.kind==='co2_ppm'&&n<0)state.errors.value='CO₂ não pode ser negativo.';if(!f.measured_at||Number.isNaN(new Date(f.measured_at+'Z').getTime()))state.errors.measured_at='Informe uma data válida de coleta em UTC.';
      if(Object.keys(state.errors).length){render();return;}if(state.mode==='offline'){state.success='';render();return;} const entry={id:seq++,astronaut_id:k.zone==='habitat'?null:f.astronaut_id,kind:f.kind,value:n,unit:k.unit,measured_at:f.measured_at+':00Z',recorded_at:new Date().toISOString(),source:f.source,quality:f.quality,measurement_zone:k.zone};state.added.push(entry);state.success=`Medição #${entry.id} salva apenas na memória deste protótipo. Nenhuma API foi chamada.`;state.form.value='';state.formRecheck=false;render();}
    MAIN.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
      if(a==='to-register')nav('register');else if(a==='to-history')nav('history');else if(a==='to-investigate')nav('investigation');else if(a==='sample'){state.form.value=state.form.kind==='sleep_hours'?'5.4':state.form.kind==='heart_rate_bpm'?'74':state.form.kind==='mood_score'?'3':state.form.kind==='co2_ppm'?'850':'22.2';render();}
      else if(a==='clear-filters'){state.historyAstronaut='all';state.historyKind='all';state.historyQuality='all';render();}
      else if(a==='run-analysis'){if(state.mode==='offline'){state.lastNoticeType='error';state.lastNotice='Falha de conexão simulada: não foi possível executar a investigação. O último resultado permanece visível.';render();return;}state.analysis=analysisFor();const linked=state.added.find(x=>x.id===state.followup?.measurement_id);if(linked){state.analysis.evidence.push('Nova leitura vinculada: #'+linked.id+' · '+fmt(linked.value)+' '+linked.unit+' · '+dt(linked.measured_at)+'.');}state.lastNoticeType='success';state.lastNotice=state.followup?.status==='completed'?'Reanálise ilustrativa solicitada após a verificação.':'Análise simulada executada. Nenhuma regra do back-end foi chamada.';if(state.analysis.nextCheck&&!state.followup){state.followup={kind:state.analysis.nextCheck.kind,astronaut_id:state.analysis.nextCheck.astronaut_id,reason:state.analysis.nextCheck.reason,created_at:new Date().toISOString(),status:'pending'};}render();}
      else if(a==='create-recheck'){if(!state.followup)return;state.form={kind:state.followup.kind,astronaut_id:state.followup.astronaut_id??'A1',value:state.followup.kind==='sleep_hours'?'6':'850',source:'synthetic',quality:'ok',measured_at:new Date().toISOString().slice(0,16)};state.formRecheck=true;state.returnToFollowup=true;state.success='';nav('register');}
      else if(a==='complete-followup'){
        if(state.mode==='offline'){
          state.lastNoticeType='error';state.lastNotice='Falha de conexão simulada. A verificação continua pendente.';render();return;
        }
        const f=state.followup;if(!f||f.status!=='pending')return;const x=state.added.find(y=>y.kind===f.kind&&y.astronaut_id===f.astronaut_id&&y.quality==='ok'&&new Date(y.recorded_at)>new Date(f.created_at));if(x){f.status='completed';f.measurement_id=x.id;state.lastNoticeType='success';state.lastNotice=`Follow-up concluído no protótipo com vínculo à medição #${x.id}. Execute nova investigação para reanalisar.`;}render();}
    });
    render();
  })();
  </script>
</body>
</html>
